<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#0a1020;--card:#111a31;--card2:#17223f;--line:#243256;--tx:#e9edf9;--mut:#8f9bbd;--pri:#5b5cf0;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--hi:#f87171;--lo:#34d399;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef1fa;--card:#fff;--card2:#f3f5fc;--line:#d9dfef;--tx:#141a30;--mut:#5d6891;color-scheme:light}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;padding:14px 16px 24px}
h1{font-size:24px;font-weight:700;margin-bottom:12px}h2{font-size:15px;font-weight:600;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;font-family:inherit;color:#fff;background:var(--pri);cursor:pointer;width:100%}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}.btn.sm{width:auto;padding:8px 14px;font-size:13px}
.bar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#38bdf8);border-radius:8px;transition:width .4s}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-style:italic;letter-spacing:3px;font-size:18px}
.fire{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px}
.ai{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#5b5cf0,#38bdf8);display:grid;place-items:center;font-size:24px;flex:none}
.t{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.t:last-child{border:0}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);flex:none;display:grid;place-items:center;background:none;color:#fff;font-size:14px;cursor:pointer}
.chk.on{background:var(--ok);border-color:var(--ok)}.chk.p1{border-color:var(--hi)}.chk.p2{border-color:var(--warn)}.chk.p3{border-color:var(--lo)}
.done{text-decoration:line-through;color:var(--mut)}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;cursor:pointer}
nav button span{font-size:20px}nav button.on{color:#8b8cff}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:8px;border-radius:9px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}.seg button.on{background:var(--card2);color:var(--tx)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}.col{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:110px}
.col h3{font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between}.tc{background:var(--card2);border-radius:10px;padding:9px;margin-bottom:8px;font-size:13px;cursor:pointer}.tc small{display:block;color:var(--mut);margin-top:2px}
.fab{position:absolute;right:18px;bottom:84px;width:54px;height:54px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:28px;box-shadow:0 6px 20px #5b5cf080;cursor:pointer}
.days{display:flex;gap:6px;margin-bottom:12px}.day{flex:1;text-align:center;padding:8px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--mut)}.day b{display:block;font-size:16px;color:var(--tx)}.day.on{background:var(--pri);border-color:var(--pri)}.day.on,.day.on b{color:#fff}
.ev{border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card2);border-left:4px solid var(--pri)}
.pill{font-size:11px;border-radius:8px;padding:3px 8px;font-weight:600}.p1{--c:var(--hi)}.p2{--c:var(--warn)}.p3{--c:var(--lo)}.pill{color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding:16px;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.mic{width:96px;height:96px;border-radius:50%;background:var(--card2);border:0;font-size:40px;margin:20px auto 10px;display:block;cursor:pointer}.mic.rec{background:var(--pri);animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 18px #5b5cf033}}@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:12px;font-size:16px;font-family:inherit;margin-bottom:10px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ach{opacity:.4}.ach.on{opacity:1}
.tl{border-left:2px solid var(--pri);margin-left:8px;padding-left:14px}.tl div{margin-bottom:12px}
.set{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.toast{position:absolute;left:16px;right:16px;bottom:90px;background:var(--card2);border:1px solid var(--line);padding:12px;border-radius:12px;z-index:30;text-align:center}
.g2>div{min-width:0}input[type=date],input[type=time]{min-width:0;height:46px;-webkit-appearance:none;appearance:none;text-align:left}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.fl select{margin:0;padding:9px;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}.cd{aspect-ratio:1;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;cursor:pointer}.cd.on{background:var(--pri);border-color:var(--pri);color:#fff}.cd.td{border-color:#8b8cff}.cd.o{opacity:.4}.cd i{width:6px;height:6px;border-radius:50%;margin-top:2px}.l1{background:var(--ok)}.l2{background:var(--warn)}.l3{background:var(--bad)}.hd{font-size:11px;color:var(--mut);text-align:center}
</style></head><body><div id="app"><main id="m"></main><nav id="nav"></nav><div id="ov"></div></div>
<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const NOW=new Date(),TODAY=iso(NOW),TOM=iso(addD(NOW,1));
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const fmt=s=>{const d=new Date(s+'T12:00');return d.getDate()+' '+MON[d.getMonth()]};
const PR={1:'Высокий',2:'Средний',3:'Низкий'};

function achs(){const mx=S.tasks.filter(t=>t.doneOn===TODAY).length,hs=Math.max(0,...S.habits.map(hstreak)),dn=S.tasks.filter(t=>t.status==='done').length;

 return `<h1>Достижения</h1>

 rec.onresult=e=>{tx.value=e.results[0][0].transcript;$('#st').textContent='Готово. Проверь текст и нажми «Распознать»'};
 rec.onerror=()=>{end();$('#st').textContent='Не удалось записать. Введи текст.'};rec.onend=end;rec.start();$('#mic').classList.add('rec');$('#st').textContent='Говорите… (нажми ещё раз, чтобы остановить)'}catch(e){rec=null;$('#st').textContent='Голос недоступен — введи текст'}}
const TM=/(?:^|\s)в\s*(\d{1,2})(?!\d)(?!\s*мин)(?:[:.](\d{2}))?\s*(?:час\S*)?\s*(утра|вечера|дня)?/;
const dword=l=>/послезавтра/.test(l)?iso(addD(NOW,2)):/завтра/.test(l)?TOM:/сегодня/.test(l)?TODAY:null;
function one(seg,bd){const l=seg.toLowerCase();let date=dword(l)||bd,time='',dur=0,cat='Личное',prio=2;
 const m=l.match(TM);if(m&&+m[1]<24){let h=+m[1];if((m[3]==='вечера'||m[3]==='дня')&&h<12)h+=12;time=pad(h)+':'+(m[2]||'00')}else if(/вечером|после работы/.test(l))time='18:30';else if(/утром/.test(l))time='09:00';
 const l2=m?l.replace(m[0],' '):l,dh=l2.match(/(\d+(?:[.,]\d+)?)\s*ч(?:ас\S*)?(?=\s|$|[.,])/),dm=l2.match(/(\d+)\s*мин/);
 if(/полчаса/.test(l2))dur=30;else if(dm)dur=+dm[1];else if(dh)dur=Math.round(parseFloat(dh[1].replace(',','.'))*60);else if(/(^|\s)час(\s|$|[.,])/.test(l2))dur=60;
 if(/зал|тренир|бег|спорт|йог|зарядк/.test(l))cat='Здоровье и спорт';else if(/продукт|магазин|купить/.test(l))cat='Покупки';else if(/курс|учить|изучить|книг|учебн|экзамен/.test(l))cat='Учёба';else if(/отчёт|отчет|клиент|встреч|презентац|работ|проект/.test(l))cat='Работа';
 if(/срочно|важно|дедлайн/.test(l))prio=1;
 if(!dur)dur=/позвонить|звонок/.test(l)?15:/зал|тренир/.test(l)?60:/продукт|магазин|купить/.test(l)?30:60;
 let title=seg.replace(/(^|\s)(послезавтра|завтра|сегодня|вечером|утром)(?=\s|$|[.,])/gi,' ').replace(/(^|\s)(нужно|надо|необходимо|не забыть|мне|хочу)(?=\s|$)/gi,' ').replace(/(^|\s)в\s*\d{1,2}(?!\d)(?!\s*мин)([:.]\d{2})?\s*(час\S*)?\s*(утра|вечера|дня)?/i,' ').replace(/\s+/g,' ').trim()||seg;
 title=title.charAt(0).toUpperCase()+title.slice(1);if(title.length>50)title=title.slice(0,50);return {title,date,time,dur,cat,prio}}
let batch=[];
function parse(s){s=(s||'').trim();if(!s){toast('Введите или продиктуйте задачу');return}
 const bd=dword(s.toLowerCase())||draft.date||TODAY;
 const segs=s.split(/[,;\n]+|\s+и\s+(?=[а-яё]+(?:ть|ться|ти|чь)(?:\s|$))/i).map(x=>x.trim()).filter(Boolean);
 const ds=segs.map(x=>one(x,bd));let cur=10*60;ds.forEach(d=>{if(!d.time){d.time=pad(Math.floor(cur/60))+':'+pad(cur%60);cur+=d.dur+15}});
 if(ds.length===1){draft=ds[0];review()}else{batch=ds;reviewBatch()}}
function reviewBatch(){sheet(`<div style="text-align:center"><b style="font-size:22px">Разобрал задач: ${batch.length}</b><p class="mut">Проверь план и подтверди</p></div><div class="card" style="margin-top:12px">${batch.map((t,i)=>`<div class="t"><div style="flex:1"><b>${esc(t.title)}</b><div class="mut">${fmt(t.date)}, ${t.time} · ${t.dur} мин · ${t.cat}</div></div><button class="btn sec sm" onclick="batch.splice(${i},1);batch.length?reviewBatch():closeSheet()">✕</button></div>`).join('')}</div><button class="btn" onclick="commitBatch()">Добавить все</button><button class="btn sec" style="margin-top:8px" onclick="closeSheet()">Отмена</button>`)}
function commitBatch(){batch.forEach((t,i)=>S.tasks.push({id:Date.now()+i,status:'planned',...t}));save();[...new Set(batch.map(t=>t.date))].forEach(d=>checkLoad(d));closeSheet();toast('Добавлено задач: '+batch.length)}
function review(){const d=draft;sheet(`<div style="text-align:center;margin-top:8px"><b style="font-size:22px">${d.id?'Изменить задачу':'Готово!'}</b><p class="mut">${d.id?'Поправь, что нужно, и сохрани':'ИИ распознал вашу задачу'}</p></div>
<div class="card" style="margin-top:14px"><label>Название</label><input value="${esc(d.title)}" onchange="draft.title=this.value"><label>Описание</label><textarea rows="2" onchange="draft.desc=this.value">${esc(d.desc||'')}</textarea>
<div class="g2"><div><label>Дата</label><input type="date" value="${d.date}" onchange="draft.date=this.value"></div><div><label>Время</label><input type="time" value="${d.time}" onchange="draft.time=this.value"></div>
<div><label>Длительность, мин</label><input type="number" min="5" step="5" value="${d.dur}" onchange="draft.dur=+this.value"></div>
<div><label>Приоритет</label><select onchange="draft.prio=+this.value">${[1,2,3].map(p=>`<option value="${p}" ${p==d.prio?'selected':''}>${PR[p]}</option>`).join('')}</select></div></div>
<label>Категория</label><select onchange="draft.cat=this.value">${cats().map(c=>`<option ${c==d.cat?'selected':''}>${c}</option>`).join('')}</select></div>
<button class="btn" onclick="commit()">${d.id?'Сохранить':'Добавить в план'}</button><button class="btn sec" style="margin-top:8px" onclick="closeSheet()">Отмена</button>`)}
function commit(){if(!draft.title)return toast('Введите название');
 if(draft.id){Object.assign(S.tasks.find(t=>t.id===draft.id),draft)}else S.tasks.push({id:Date.now(),status:'planned',...draft});save();checkLoad(draft.date);closeSheet();toast(draft.id?'Изменения сохранены':'Задача добавлена в план')}
function moveTask(id,d){if(!d)return;S.tasks.find(x=>x.id==id).date=d;save();checkLoad(d);closeSheet();toast('Перенесено на '+fmt(d))}
function startTask(id){const t=S.tasks.find(x=>x.id==id);t.status='progress';save();render();toast('Задача в процессе: '+t.title)}
function edit(id){const t=S.tasks.find(x=>x.id==id);sheet(`<div class="row sp"><button class="btn sec sm" onclick="closeSheet()">←</button><b>Задача</b><span></span></div>
<div class="card" style="margin-top:14px"><b style="font-size:18px">${ICON[t.cat]||'🏷️'} ${esc(t.title)}</b><p class="mut">${fmt(t.date)}, ${t.time} · ${t.dur} мин · ${t.cat}</p><span class="pill p${t.prio}">${PR[t.prio]}</span></div>
${t.desc?`<p style="margin-top:8px">${esc(t.desc)}</p>`:''}<h2>Перенести на другую дату</h2><input type="date" value="${t.date}" onchange="moveTask(${t.id},this.value)"><h2>Статус</h2><div class="g2">${Object.keys(ST).map(s=>`<button class="btn ${t.status===s?'':'sec'}" onclick="setSt(${id},'${s}')">${ST[s]}</button>`).join('')}</div>
<h2>&nbsp;</h2><button class="btn sec" onclick="draft={...S.tasks.find(x=>x.id==${id})};review()">Изменить</button>
<button class="btn sec" style="margin-top:8px;color:var(--bad)" onclick="if(confirm('Удалить задачу?')){S.tasks=S.tasks.filter(x=>x.id!=${id});save();closeSheet();toast('Задача удалена')}">Удалить</button>`)}
function setSt(id,s){const t=S.tasks.find(x=>x.id==id);if(s==='done'&&t.status!=='done'){toggle(id)}else if(t.status!==s){if(t.status==='done'){addXp(-(t.xp||0),t.title,'t'+t.id);S.doneTotal--;t.xp=0;t.doneOn=null}t.status=s;save()}closeSheet()}

/* ИИ-режиссёр */
let plan=[],planDate=TODAY;
function aiPlan(){checkLoad(TODAY);const l=S.tasks.filter(t=>t.date===TODAY&&t.status!=='done'&&t.status!=='postponed');
 if(!l.length){toast('Нет задач для планирования');return}
 const sorted=[...l].sort((a,b)=>a.prio-b.prio||a.time.localeCompare(b.time));
 let cur=Math.max(NOW.getHours()*60+NOW.getMinutes()+10,9*60);cur=Math.ceil(cur/15)*15;plan=[];planDate=TODAY;if(cur>21*60){planDate=TOM;cur=9*60}
 const fixed=t=>/Здоровье|Покупки/.test(t.cat);
 const flex=sorted.filter(t=>!fixed(t)),fx=sorted.filter(fixed).sort(byTime);
 flex.forEach(t=>{plan.push({t,s:cur});cur+=t.dur+15});
 fx.forEach(t=>{let s=Math.max(cur,t.time>'18:00'?+t.time.slice(0,2)*60+ +t.time.slice(3):cur);plan.push({t,s});cur=s+t.dur+15});
 sheet(`<div style="text-align:center"><div class="ai" style="margin:0 auto 8px">🤖</div><b style="font-size:20px">План на сегодня готов!</b><p class="mut">${planDate===TOM?'На сегодня уже поздно — планирую на завтра с 09:00.':'Я учёл твои цели, дедлайны и привычки.'}</p></div>
 <div class="card" style="margin-top:12px">${plan.map(p=>`<div class="t"><span class="pill p${p.t.prio}">${PR[p.t.prio]}</span><div><b>${hm(p.s)} – ${hm(p.s+p.t.dur)}</b><div>${esc(p.t.title)}</div></div></div>`).join('')}</div>
 <div class="card"><b>Почему так?</b><ul class="mut" style="padding-left:18px;margin-top:6px"><li>Сначала задачи с высоким приоритетом.</li><li>Спорт и покупки — в вечернее время, как обычно.</li><li>Между задачами 15 минут, чтобы не перегружать день.</li></ul></div>
 <div class="g2"><button class="btn" onclick="acceptPlan()">Принять план</button><button class="btn sec" onclick="closeSheet()">Изменить</button></div>`)}
function acceptPlan(){plan.forEach(p=>{p.t.time=hm(p.s);p.t.date=planDate});save();closeSheet();toast('План принят — время задач обновлено')}

/* Уведомления */
function addGoal(){const v=$('#gl').value.trim();if(!v)return;S.goals.push(['🎯',v,'']);save();render()}
function delGoal(i){S.goals.splice(i,1);save();render()}
const cats=()=>[...CATS,...(S.ucats||[])];
function addCat(){const v=$('#cn').value.trim();if(!v||cats().includes(v))return;S.ucats.push(v);save();render()}
function delCat(i){S.ucats.splice(i,1);save();render()}
function goalDone(i){const g=S.goals[i],k='g'+g[1];if(g[2]==='done'){g[2]='';addXp(-50,g[1],k)}else{g[2]='done';addXp(50,'Цель достигнута: '+g[1],k)}save();render()}
const HF={daily:'Каждый день',weekdays:'По будням',weekends:'По выходным'};
const hdue=(h,d)=>{const w=new Date(d+'T12:00').getDay();return h.f==='daily'||(h.f==='weekdays'&&w>0&&w<6)||(h.f==='weekends'&&(w===0||w===6))};
function hstreak(h){let n=0,d=new Date(NOW);if(!h.done.includes(iso(d)))d=addD(d,-1);for(let i=0;i<400;i++){const k=iso(d);if(hdue(h,k)){if(h.done.includes(k))n++;else break}d=addD(d,-1)}return n}
function hToggle(id){const h=S.habits.find(x=>x.id==id),i=h.done.indexOf(TODAY);if(i>=0){h.done.splice(i,1);addXp(-10,'',' h'+id+TODAY)}else{h.done.push(TODAY);addXp(10,'Привычка: '+h.t,' h'+id+TODAY)}save();render()}
function addHabit(){const v=$('#hn').value.trim();if(!v){toast('Введите название привычки');return}S.habits.push({id:Date.now(),t:v,f:$('#hf').value||'daily',done:[]});save();render()}
const habToday=()=>{const hs=S.habits.filter(h=>hdue(h,TODAY));return hs.length?`<div class="card"><div class="row sp"><b>Привычки сегодня</b><span class="mut">${hs.filter(h=>h.done.includes(TODAY)).length} из ${hs.length}</span></div>${hs.map(h=>`<div class="t"><button class="chk ${h.done.includes(TODAY)?'on':''}" onclick="hToggle(${h.id})">${h.done.includes(TODAY)?'✓':''}</button><div style="flex:1">${esc(h.t)}<div class="mut">🔥 ${hstreak(h)}</div></div></div>`).join('')}</div>`:''};
function vHabits(){return `<div class="card"><input id="hn" placeholder="Новая привычка, например: читать 20 минут"><select id="hf">${Object.entries(HF).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button class="btn" onclick="addHabit()">Добавить привычку</button></div>`+(S.habits.map(h=>{const due=hdue(h,TODAY),dn=h.done.includes(TODAY),wk=lastN(7).map(d=>`<span style="color:${h.done.includes(d)?'var(--ok)':'var(--line)'}">●</span>`).join(' ');return `<div class="card"><div class="t" style="border:0;padding:0"><button class="chk ${dn?'on':''}" ${due?'':'disabled'} onclick="hToggle(${h.id})">${dn?'✓':''}</button><div style="flex:1" onclick="habit(${h.id})"><b>${esc(h.t)}</b><div class="mut">${HF[h.f]} · 🔥 ${hstreak(h)}${due?'':' · сегодня не нужно'}</div></div></div><div style="margin-top:8px">${wk}</div></div>`}).join('')||'<p class="mut">Привычек пока нет. Добавь первую: регулярность важнее разовых усилий.</p>')}
function habit(id){const h=S.habits.find(x=>x.id==id);sheet(`<div class="row sp"><button class="btn sec sm" onclick="closeSheet()">←</button><b>Привычка</b><span></span></div><div class="card" style="margin-top:14px"><b style="font-size:18px">${esc(h.t)}</b><p class="mut">${HF[h.f]} · серия ${hstreak(h)} · всего отметок ${h.done.length}</p></div><h2>Последние 28 дней</h2><div class="card" style="line-height:2">${lastN(28).map(d=>`<span title="${d}" style="color:${h.done.includes(d)?'var(--ok)':hdue(h,d)?'var(--line)':'transparent'}">●</span>`).join(' ')}</div><button class="btn sec" style="color:var(--bad)" onclick="if(confirm('Удалить привычку?')){S.habits=S.habits.filter(x=>x.id!=${id});save();closeSheet()}">Удалить привычку</button>`)}
let tt='tasks';
const segT=()=>`<div class="seg"><button class="${tt==='tasks'?'on':''}" onclick="tt='tasks';render()">Задачи</button><button class="${tt==='habits'?'on':''}" onclick="tt='habits';render()">Привычки</button></div>`;
function vTasks(){return tt==='habits'?'<h1>Задачи</h1>'+segT()+vHabits():vTasks0().replace('<h1>Задачи</h1>','<h1>Задачи</h1>'+segT())}
function whatNow(){const nm=new Date(),cur=pad(nm.getHours())+':'+pad(nm.getMinutes()),L=S.tasks.filter(t=>t.status!=='done'&&t.status!=='postponed'&&(t.date===TODAY||over(t)));
 let t=L.find(x=>x.status==='progress'),why='Ты уже начал эту задачу — лучше довести её до конца.';
 if(!t){const o=L.filter(over).sort((a,b)=>a.prio-b.prio)[0];if(o){t=o;why='Задача просрочена: сначала закрой её или перенеси.'}}
 if(!t){const td=L.filter(x=>x.date===TODAY).sort(byTime),c=td.filter(x=>x.time<=cur).sort((a,b)=>a.prio-b.prio)[0];if(c){t=c;why='Время этой задачи уже наступило.'}else if(td[0]){t=td[0];why='Это ближайшая задача по плану.'}}
 const h=S.habits.find(x=>hdue(x,TODAY)&&!x.done.includes(TODAY));
 sheet(`<div class="row sp"><button class="btn sec sm" onclick="closeSheet()">←</button><b>Что сейчас лучше сделать</b><span></span></div><div class="card row" style="margin-top:14px"><div class="ai">🤖</div><div>${t?`<b>«${esc(t.title)}»</b><div class="mut">${t.time} · ${t.dur} мин</div><p style="margin-top:6px">${why}</p>`:h?`Задач на сейчас нет. Отметь привычку: <b>${esc(h.t)}</b>.`:'Всё на сегодня сделано. Отдохни или добавь новую задачу.'}</div></div>${t?`<button class="btn" onclick="startTask(${t.id});closeSheet()">Начать</button>`:''}`)}
const NT=[['task','Напоминания о задачах'],['deadline','Приближение сроков'],['habit','Напоминания о привычках'],['ach','Достижения'],['ai','Рекомендации ИИ']];
function notifSet(){sheet(`<div class="row sp"><button class="btn sec sm" onclick="closeSheet()">←</button><b>Уведомления</b><span></span></div><p class="mut" style="margin:12px 0">Выбери, о чём напоминать. Пока уведомления показываются внутри приложения.</p><div class="card">${NT.map(([k,l])=>`<div class="set" onclick="S.nt.${k}=!S.nt.${k};save();notifSet()"><span>${l}</span><span>${S.nt[k]?'🟢 Вкл':'⚪ Выкл'}</span></div>`).join('')}</div><button class="btn" onclick="notifs()">Показать уведомления</button>`)}
function notifs(){const l=[],n=todayTasks().filter(t=>t.status!=='done')[0];
 if(S.nt.task&&n)l.push(['🔔','Сегодня '+n.time,'Пора начать задачу «'+esc(n.title)+'»']);
 if(S.nt.deadline){S.tasks.filter(over).slice(0,3).forEach(t=>l.push(['⏰','Просрочено','«'+esc(t.title)+'» — '+fmt(t.date)]));S.tasks.filter(t=>t.date===TOM&&t.status==='planned').slice(0,2).forEach(t=>l.push(['⏰','Завтра '+t.time,'Напоминание: '+esc(t.title)]))}
 if(S.nt.habit)S.habits.filter(h=>hdue(h,TODAY)&&!h.done.includes(TODAY)).forEach(h=>l.push(['🔁','Привычка','Не забудь: '+esc(h.t)]));
 if(S.nt.ach){if(S.streak>0)l.push(['🔥','Серия',S.streak+' дн. подряд — так держать!']);const a=achs().filter(x=>x[3]);if(a.length)l.push(['🏆','Достижение','Получено: «'+a[a.length-1][1]+'»'])}
 if(S.nt.ai&&S.tasks.some(t=>t.date===TODAY&&t.status!=='done'))l.push(['🤖','Совет ИИ','Нажми «Что мне сейчас лучше сделать?» на экране «Сегодня».']);
 sheet(`<div class="row sp"><button class="btn sec sm" onclick="closeSheet()">←</button><b>Уведомления</b><span></span></div><div style="margin-top:14px">${l.map(x=>`<div class="card row"><span style="font-size:24px">${x[0]}</span><div><div class="mut">${x[1]}</div>${x[2]}</div></div>`).join('')||'<p class="mut">Пока нет уведомлений.</p>'}</div><button class="btn sec" onclick="notifSet()">Настроить уведомления</button>`)}
render();
if(location.hash==="#new")addTask();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&iso(new Date())!==TODAY)location.reload()});
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
